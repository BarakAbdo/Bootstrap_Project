<!-- الملف الشخصي -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <title>الملف الشخصي</title>
</head>
<body class="bg-body-secondary">

    <header class="header bg-dark text-white text-center py-4 shadow">
        <h1 class="head fs-2 fw-bold mb-3">الملف الشخصي</h1>

        <nav class="n1">
            <a class="link btn btn-outline-light px-4 py-2 rounded-pill fw-semibold shadow-sm" href="../index/index.html">
                الصفحة الرئيسية
            </a>
        </nav>
    </header>

    <main class="m1 container col-lg-7 py-5">

        <section class="s1 bg-white text-dark p-4 rounded-4 shadow-sm mb-4 border">

            <h2 class="head2 text-dark fs-4 fw-bold text-center mb-4">
                بيانات المستخدم
            </h2>

            <img class="img d-block mx-auto rounded-circle shadow mb-4 border border-3 border-secondary object-fit-cover"
                 src="../assest/OIP.webp"
                 width="200"
                 height="200"
                 alt="صورة المستخدم">

            <p class="paragraph1 bg-body-secondary text-dark p-3 rounded-3 mb-2 border">
                الاسم:  براك غالب
            </p>

            <p class="paragraph2 bg-body-secondary text-dark p-3 rounded-3 mb-2 border">
                البريد الإلكتروني: barak7255@gmail.com
            </p>

            <p class="paragraph3 bg-body-secondary text-dark p-3 rounded-3 mb-0 border">
                البلد: السعودية
            </p>

        </section>


        <section class="s2 bg-dark text-white p-4 rounded-4 shadow">

            <h2 class="head2 text-white fs-4 fw-bold text-center mb-4">
                تحديث بياناتك
            </h2>

            <form class="f1">

                <label class="name form-label fw-semibold">
                    الاسم:
                </label><br>

                <input class="input form-control mb-3"
                       type="text"
                       name="name"><br><br>

                <label class="email form-label fw-semibold">
                    البريد الإلكتروني:
                </label><br>

                <input class="input2 form-control mb-3"
                       type="email"
                       name="email"><br><br>

                <label class="password form-label fw-semibold">
                    كلمة المرور الجديدة:
                </label><br>

                <input class="input form-control mb-3"
                       type="password"
                       name="password"><br><br>

                <button class="button btn btn-light text-dark fw-semibold px-4 py-2 rounded-pill shadow-sm d-block mx-auto">
                    حفظ التغييرات
                </button>

            </form>

        </section>

    </main>


    <footer class="fot bg-dark text-secondary text-center p-3 mt-4">
        <p class="paragraph4 mb-0">
            ©️ 2025 أكاديمية البرمجة
        </p>
    </footer>

</body>
</html>
