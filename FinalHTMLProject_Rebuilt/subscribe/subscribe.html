<!-- صفحة الاشتراك -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>اشترك الآن</title>
</head>
<body class="bg-light">

    <header class="header bg-dark text-white text-center py-4 shadow-sm">
        <h1 class="head fs-2 fw-semibold mb-3">اشترك في المنصة</h1>
        <nav class="n1">
            <a class="link btn btn-outline-light px-4 py-2 rounded-pill fw-semibold" href="../index/index.html">الصفحة الرئيسية</a>
        </nav>
    </header>

    <main class="m1 container col-lg-5 py-5">

        <section class="section1 bg-white p-4 p-md-5 rounded-4 shadow border-0">

            <form class="form">

                <label class="name1 form-label text-dark fw-semibold">الاسم الكامل:</label><br>
                <input class="input1 form-control bg-light border-secondary-subtle py-2" type="text" placeholder="مثال: أحمد علي" name="name"><br><br>

                <label class="nameEmail form-label text-dark fw-semibold">البريد الإلكتروني:</label><br>
                <input class="input2 form-control bg-light border-secondary-subtle py-2" type="email" placeholder="you@example.com" name="email"><br><br>

                <label class="namePassword form-label text-dark fw-semibold">كلمة المرور:</label><br>
                <input class="input3 form-control bg-light border-secondary-subtle py-2" type="password" name="password"><br><br>

                <label class="confrimPassword form-label text-dark fw-semibold">تأكيد كلمة المرور:</label><br>
                <input class="input4 form-control bg-light border-secondary-subtle py-2" type="password" name="confirmPass"><br><br>

                <button class="button btn btn-dark w-100 py-2 fw-semibold rounded-3 shadow-sm">
                    اشترك الآن
                </button>

            </form>

        </section>

    </main>

    <footer class="footer bg-dark text-white-50 text-center p-3 mt-4">
        <p class="paragraph mb-0">©️ 2025 الاشتراك في المنصة</p>
    </footer>

</body>
</html>
