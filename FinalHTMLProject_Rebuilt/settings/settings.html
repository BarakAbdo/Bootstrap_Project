<!-- إعدادات الحساب -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <title>الإعدادات</title>
</head>
<body class="bg-dark">

    <header class="header bg-dark text-white text-center py-4 shadow-lg border-bottom border-secondary">
        <h1 class="head1 fs-2 fw-bold mb-3">إعدادات الحساب</h1>
        <nav class="n1 text-center"><a class="link btn btn-outline-light px-4 py-2 rounded-pill fw-semibold shadow-sm" href="../index/index.html">الصفحة الرئيسية</a></nav>
    </header>

    <main class="m1 container col-lg-6 py-5">

        <section class="section1 bg-white text-dark p-4 p-md-5 rounded-4 shadow-lg border">

            <h2 class="head2 fs-3 fw-bold text-center mb-4">تفضيلات المستخدم</h2>

            <form class="form">

                <label class="nameLang form-label fw-bold">اللغة المفضلة:</label><br>

                <select class="select form-select form-select-lg bg-body-secondary border-0 shadow-sm">
                    <option class="op1">العربية</option>
                    <option class="op2">English</option>
                </select><br><br>

                <label class="nameMes form-label fw-bold">تفعيل الإشعارات:</label><br>

                <input class="input1 form-check-input border-dark shadow-sm" type="checkbox" name="email" checked> بريد إلكتروني<br><br>

                <input class="input2 form-check-input border-dark shadow-sm" type="checkbox" name="textMessage"> رسائل نصية<br><br>

                <label class="styleChoose form-label fw-bold">اختيار المظهر:</label><br>

                <input class="input3 form-check-input border-dark shadow-sm" type="radio" name="theme" checked> فاتح

                <input class="input3 form-check-input border-dark shadow-sm" type="radio" name="theme"> داكن<br><br>

                <button class="button btn btn-dark btn-lg fw-bold px-4 py-2 rounded-pill shadow-sm d-block mx-auto">حفظ الإعدادات</button>

            </form>
        </section>
    </main>

    <footer class="bg-black text-secondary text-center p-3 mt-4 border-top border-secondary">
        <p>©️ 2025 إعدادات الحساب - جميع الحقوق محفوظة</p>
    </footer>
</body>
</html>
